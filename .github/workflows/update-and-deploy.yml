name: 每小時更新教師瀏覽數

on:
  schedule:
    # GitHub 的排程時間是 UTC；避開整點（整點最塞、最常被延遲或跳過）
    - cron: "23 * * * *"
  workflow_dispatch:        # 可在 Actions 頁面手動按「Run workflow」，也可給外部排程服務呼叫
  push:
    branches: [main]
    paths-ignore:
      - "data.json"
      - "views_cache.json"

permissions:
  contents: write   # 讓機器人能 commit data.json
  pages: write      # 部署 GitHub Pages
  id-token: write

# 同一時間只跑一個，避免兩次排程互相搶著 push
concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 爬取並產生 data.json
        run: python crawl.py

      - name: 提交更新後的資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data.json views_cache.json
          if git diff --cached --quiet; then
            echo "資料沒有變化，不需提交"
          else
            git commit -m "自動更新瀏覽數 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            # 若期間有人手動 push，先合併再推；衝突時以這次爬到的新資料為準
            for i in 1 2 3; do
              if git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push; then
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      # 部署放在同一個 workflow 裡：
      # 用 GITHUB_TOKEN 推上去的 commit 不會觸發其他 workflow，
      # 若部署寫在另一個「on: push」的檔案，網站就永遠不會更新
      - name: 準備網站檔案
        run: |
          mkdir -p _site
          cp index.html rank.css rank.js data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
